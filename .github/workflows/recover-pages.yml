name: Recover stalled Pages publication
on:
  push:
    paths:
      - '.github/workflows/recover-pages.yml'
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the specific stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/daniilkhlynov1-sys/gostudy/pages/deployments/e6c862d22192efc930ac15ae6e2c4e4c3640c051/cancel"
