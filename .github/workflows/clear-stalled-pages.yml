name: Clear stalled Pages deployment
on:
  push:
    paths:
      - '.github/workflows/clear-stalled-pages.yml'
permissions:
  pages: write
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel identified blocking deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/daniilkhlynov1-sys/gostudy/pages/deployments/9b9d70f4cff6e5b513a3f9867e0f8ad8a6d726fa/cancel"
